  - url: https://investors.cargurus.com/news-releases/news-release-details/cargurus-helps-dealerships-solve-attribution-more-insight
    type: PressRelease
    note: CarGurus opened its API to analytics partners (vAuto, Clarivoy, Vistadash).
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. Every documented CarGurus public API is
    request/response HTTP (GET for Car Selector, POST for IMV/Reviews/Stats). No
    AsyncAPI document was created because there is no server-push transport on any
    CarGurus public API to model; inventory feeds and CRM lead delivery are
    feed/email mechanisms outside the documented API surface.
