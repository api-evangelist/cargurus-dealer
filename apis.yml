aid: cargurus-dealer
url: https://raw.githubusercontent.com/api-evangelist/cargurus-dealer/refs/heads/main/apis.yml
name: CarGurus
kind: company
description: CarGurus is an automotive shopping and dealer marketing platform that
  connects car shoppers with franchise and independent dealers through data-driven
  listings, its Instant Market Value (IMV) deal ratings, and dealer reviews. For
  developers and partners, CarGurus publishes a small set of documented HTTP APIs
  under /Cars/api/ - an open Car Selector API for building new/used search widgets,
  and partner/dealer-gated APIs for Instant Market Value, dealer reviews, and dealer
  performance statistics (leads, VDPs, SRPs, impressions). Dealer inventory itself is
  ingested through inventory feeds (feed providers / IMT), not a documented public
  pull API, and leads are delivered to dealer CRMs rather than exposed as a public
  REST endpoint.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Automotive
- Marketplace
- Car Listings
- Dealer
- Vehicle Pricing
- Reviews
- Inventory
