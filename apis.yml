modified: '2026-07-10'
specificationVersion: '0.19'
apis:
- aid: cargurus-dealer:cargurus-car-selector-api
  name: CarGurus Car Selector API
  tags:
  - Car Listings
  - Search
  - Makes and Models
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.cargurus.com/Cars/developers/docs/CarSelector.html
  baseURL: https://www.cargurus.com/Cars/api/1.0
  properties:
  - url: https://www.cargurus.com/Cars/developers/docs/CarSelector.html
    type: Documentation
  - url: https://www.cargurus.com/Cars/developers/docs/CarSelector.html
    type: APIReference
  - url: openapi/cargurus-dealer-openapi.yml
    type: OpenAPI
  description: Open (no-auth) API for building your own new/used listing search widget.
    List available makes and models plus search distances, then construct a listing
    search redirect URL. Endpoints - GET listMakes.action, GET listModels.action, and
    GET listingSearch.action.
- aid: cargurus-dealer:cargurus-instant-market-value-api
  name: CarGurus Instant Market Value API
  tags:
  - Vehicle Pricing
  - IMV
  - Deal Rating
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.cargurus.com/Cars/developers/docs/InstantMarketValue.html
  baseURL: https://www.cargurus.com/Cars/api/1.0
  properties:
  - url: https://www.cargurus.com/Cars/developers/docs/InstantMarketValue.html
    type: Documentation
  - url: https://www.cargurus.com/Cars/developers/docs/InstantMarketValue.html
    type: APIReference
  - url: openapi/cargurus-dealer-openapi.yml
    type: OpenAPI
  description: Partner/dealer-gated API to retrieve the CarGurus Instant Market Value
    for one or more cars, plus the deal rating (GREAT_PRICE, GOOD_PRICE, FAIR_PRICE,
    OVERPRICED, and more) and normalized make/model/trim/options in the CarGurus
    ontology. POST imvRequest.action with an appId and authToken issued by CarGurus.
- aid: cargurus-dealer:cargurus-dealer-reviews-api
  name: CarGurus Dealer Reviews API
  tags:
  - Reviews
  - Dealer
  - Ratings
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.cargurus.com/Cars/developers/docs/DealerReviews.html
  baseURL: https://www.cargurus.com/Cars/api/1.0
  properties:
  - url: https://www.cargurus.com/Cars/developers/docs/DealerReviews.html
    type: Documentation
  - url: https://www.cargurus.com/Cars/developers/docs/DealerReviews.html
    type: APIReference
  - url: openapi/cargurus-dealer-openapi.yml
    type: OpenAPI
  description: Partner/dealer-gated API to retrieve the sales reviews for a specific
    CarGurus dealer, including 1-5 star ratings, author, body, moderation status, and
    optional dealership management responses. POST dealerReviewsRequest.action with an
    appId and authToken. External reuse is limited to 160 characters with attribution
    and a link back to CarGurus.
- aid: cargurus-dealer:cargurus-dealer-stats-api
  name: CarGurus Dealer Stats API
  tags:
  - Analytics
  - Leads
  - Dealer Performance
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.cargurus.com/Cars/developers/docs/DealerStatsV2Daily.html
  baseURL: https://www.cargurus.com/Cars/api/2.0
  properties:
  - url: https://www.cargurus.com/Cars/developers/docs/DealerStatsV2Daily.html
    type: Documentation
  - url: https://www.cargurus.com/Cars/developers/docs/DealerStatsV2Daily.html
    type: APIReference
  - url: openapi/cargurus-dealer-openapi.yml
    type: OpenAPI
  description: Partner/dealer-gated API (v2.0) to retrieve inventory performance
    statistics for a dealer - phone/chat/SMS/email leads, VDPs, SRPs, printouts,
    map/website/social clicks, impressions, and a daily_stats time series. Consumed by
    dealer analytics partners (for example vAuto, Clarivoy, Vistadash). POST
    dealerStatsRequest.action with an appId and authToken. Response fields are modeled
    from CarGurus documentation.
